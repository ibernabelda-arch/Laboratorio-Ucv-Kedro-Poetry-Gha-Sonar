[project]

name = "si-image-processing-lab"
version = "0.1.0"
description = ""
authors = [
    {name = "Ivan Bernabel",email = "ibernabelda@ucvvirtual.edu.pe"}
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "pillow (>=12.2.0,<13.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "ruff (>=0.15.14,<0.16.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "kedro (>=1.4.0,<2.0.0)"
]

[tool.poetry]
packages = [{ include = "si_image_processing", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
kedro = {allow-prereleases = true}
